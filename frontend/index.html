<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuemJoga" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuemJogaFC - Organize seu racha sem estresse" />
    <title>QuemJogaFC - Gestão de Rachas</title>
    <script>
      // Aplica o tema antes do primeiro desenho, sem piscar o escuro (mesma regra de src/hooks/useTema.ts).
      try {
        var tema = localStorage.getItem('quemjogafc:tema')
        if (tema === 'claro' || (tema !== 'escuro' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('tema-claro')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
